type PictureRequest @entity {
  id: ID!
  address: Bytes!
  budget: BigInt!
  creator: Bytes!
  createdAt: BigInt!
  expiresAt: BigInt!
  metadata: PictureRequestMetadata
  comments: [RequestComment!]! @derivedFrom(field: "request")
  submissions: [RequestSubmission!]! @derivedFrom(field: "request")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type PictureRequestMetadata @entity {
  id: ID!  # Use the IPFS hash as the ID
  title: String!
  description: String!
  imageId: String!
}

type RequestSubmission @entity {
  id: ID!
  address: Bytes!
  request: PictureRequest!
  submitter: Bytes!
  price: BigInt!
  createdAt: BigInt!
  metadata: RequestSubmissionMetadata
  purchases: [SubmissionPurchase!]! @derivedFrom(field: "submission")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RequestSubmissionMetadata @entity {
  id: ID!  # Use the IPFS hash as the ID
  description: String!
  freeImageId: String!
  encryptedImageId: String!
  watermarkedImageId: String!
}

type RequestComment @entity {
  id: ID!
  address: Bytes!
  request: PictureRequest!
  commenter: Bytes!
  createdAt: BigInt!
  metadata: RequestCommentMetadata
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RequestCommentMetadata @entity {
  id: ID!  # Use the IPFS hash as the ID
  text: String!
}

type SubmissionPurchase @entity {
  id: ID!
  submission: RequestSubmission!
  price: BigInt!
  purchaser: Bytes!
  purchaseDate: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
