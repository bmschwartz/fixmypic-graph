specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: FixMyPicFactory
    network: zksync-era-testnet
    source:
      address: "0xf2FcC18ED5072b48C0a076693eCa72fE840b3981"
      abi: FixMyPicFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/fixMyPicFactoryMapper.ts
      entities:
        - RequestComment
        - PictureRequest
        - RequestSubmission
        - SubmissionPurchase
        - PictureRequestMetadata
        - RequestSubmissionMetadata
        - RequestCommentMetadata
      abis:
        - name: FixMyPicFactory
          file: ./abis/FixMyPicFactory.json
        - name: PictureRequest
          file: ./abis/PictureRequest.json
        - name: RequestComment
          file: ./abis/RequestComment.json
        - name: RequestSubmission
          file: ./abis/RequestSubmission.json
      eventHandlers:
        - event: RequestCommentCreated(indexed address,indexed address,string,indexed address,uint256)
          handler: handleRequestCommentCreated
        - event: PictureRequestCreated(indexed address,string,uint256,indexed address,uint256,uint256)
          handler: handlePictureRequestCreated
        - event: RequestSubmissionCreated(indexed address,indexed address,string,uint256,indexed address,uint256)
          handler: handleRequestSubmissionCreated
        - event: SubmissionPurchased(indexed address,indexed address,uint256,uint256)
          handler: handleSubmissionPurchased

templates:
  - name: PictureRequestMetadata
    kind: file/ipfs
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/pictureRequestMetadataMapper.ts
      handler: handlePictureRequestMetadata
      entities:
        - PictureRequestMetadata
      abis:
        - name: PictureRequest
          file: ./abis/PictureRequest.json

  - name: RequestSubmissionMetadata
    kind: file/ipfs
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/requestSubmissionMetadataMapper.ts
      handler: handleRequestSubmissionMetadata
      entities:
        - RequestSubmissionMetadata
      abis:
        - name: RequestSubmission
          file: ./abis/RequestSubmission.json

  - name: RequestCommentMetadata
    kind: file/ipfs
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/requestCommentMetadataMapper.ts
      handler: handleRequestCommentMetadata
      entities:
        - RequestCommentMetadata
      abis:
        - name: RequestComment
          file: ./abis/RequestComment.json
